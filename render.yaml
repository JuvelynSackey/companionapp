services:
  # Express API. The database is a free Neon Postgres (it does not expire,
  # unlike Render's free database); see docs/deployment.md.
  - type: web
    name: campus-companion-backend
    runtime: node
    rootDir: backend
    region: frankfurt
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      # Secrets entered in the Render dashboard when the blueprint is created
      # (sync: false). Never put their values in this file.
      #   DATABASE_URL: Neon's connection string (with ?sslmode=require).
      #   FIREBASE_SERVICE_ACCOUNT: the Firebase service-account key JSON on
      #   one line; push and Google sign-in share it. If it is missing or
      #   wrong, the API still starts and both features stay off.
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FCM_ENABLED
        value: "true"
      - key: GOOGLE_SIGN_IN_ENABLED
        value: "true"
